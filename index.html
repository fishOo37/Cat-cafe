<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cozy Café Home</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background: url("https://img.magnific.com/premium-photo/serene-sunset-scene-featuring-sleeping-cat-balcony-surrounded-by-plants-books_1383414-2910.jpg?semt=ais_hybrid&w=740&q=80") no-repeat center center fixed;
        background-size: cover;
        font-family: "Segoe UI", sans-serif;
        color: #fff;
        overflow-x: hidden;
    }

    /* Soft overlay for warmth */
    .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.35);
        backdrop-filter: blur(2px);
        z-index: -1;
    }

    /* Corner anime cats */
    .corner-cat {
        position: fixed;
        width: 120px;
        cursor: pointer;
        transition: transform 0.2s ease;
        z-index: 10;
    }
    .corner-cat:hover {
        transform: scale(1.1);
    }

    #cat-left { bottom: 10px; left: 10px; }
    #cat-right { bottom: 10px; right: 10px; }

    /* Pet animation */
    @keyframes pet {
        0% { transform: scale(1); }
        50% { transform: scale(1.15); }
        100% { transform: scale(1); }
    }
    .petting {
        animation: pet 0.4s ease;
    }

    /* Falling leaves */
    .leaf {
        position: fixed;
        top: -20px;
        width: 18px;
        opacity: 0.7;
        animation: fall linear infinite;
        pointer-events: none;
    }
    @keyframes fall {
        to {
            transform: translateY(110vh) rotate(360deg);
        }
    }

    /* Main container */
    .panel {
        width: 420px;
        background: rgba(0,0,0,0.55);
        padding: 20px;
        border-radius: 15px;
        margin: 40px auto;
        backdrop-filter: blur(4px);
    }

    h2 { margin-top: 0; }

    /* To‑do list */
    .todo-item {
        display: flex;
        align-items: center;
        margin-bottom: 8px;
    }
    .todo-item input[type="checkbox"] {
        width: 18px;
        height: 18px;
        margin-right: 10px;
    }
    .todo-item input[type="text"] {
        flex: 1;
        background: transparent;
        border: none;
        border-bottom: 1px solid #ccc;
        color: #fff;
        outline: none;
    }

    /* Mood tracker */
    .mood-box {
        background: rgba(255,255,255,0.1);
        padding: 10px;
        border-radius: 10px;
        margin-top: 10px;
    }

    /* Magic button */
    .magic-btn {
        margin-top: 15px;
        padding: 10px 20px;
        background: #ffb3d1;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.3s;
    }
    .magic-btn:hover {
        background: #ffcce0;
    }

    /* Links */
    .links a {
        display: inline-block;
        margin-right: 10px;
        color: #ffe6f2;
        text-decoration: none;
        font-weight: bold;
    }

    /* Calendar */
    .calendar-box {
        margin-top: 10px;
        padding: 10px;
        background: rgba(255,255,255,0.1);
        border-radius: 10px;
        text-align: center;
    }

</style>
</head>
<body>

<div class="overlay"></div>

<!-- Anime corner cats -->
<img id="cat-left" class="corner-cat" src="https://i.imgur.com/4yKXg7T.png">
<img id="cat-right" class="corner-cat" src="https://i.imgur.com/2cV7x0H.png">

<!-- Falling leaves -->
<script>
for (let i = 0; i < 12; i++) {
    let leaf = document.createElement("img");
    leaf.src = "https://i.imgur.com/1Q9Z1zE.png";
    leaf.className = "leaf";
    leaf.style.left = Math.random() * 100 + "vw";
    leaf.style.animationDuration = 6 + Math.random() * 5 + "s";
    leaf.style.animationDelay = Math.random() * 5 + "s";
    document.body.appendChild(leaf);
}
</script>

<div class="panel">

    <h2>✨ Cozy Café Dashboard ✨</h2>

    <!-- Daily Quote -->
    <div id="quote-box"></div>

    <!-- Calendar -->
    <div class="calendar-box">
        <div id="date"></div>
        <div id="time"></div>
    </div>

    <!-- To‑do List -->
    <h3>To‑Do List</h3>
    <div id="todo-list"></div>
    <button onclick="addTodo()">Add Item</button>

    <!-- Mood Tracker -->
    <h3>Mood Tracker ☕</h3>
    <div class="mood-box">
        <label>Coffee Level Today:</label><br>
        <input type="range" id="coffee" min="0" max="5">
        <textarea id="mood-notes" placeholder="How are you feeling today?" style="width:100%;height:60px;margin-top:5px;"></textarea>
        <button onclick="saveMood()">Save Mood</button>
    </div>

    <!-- Magic Button -->
    <button class="magic-btn" onclick="doMagic()">Magic ✨</button>

    <!-- Links -->
    <div class="links">
        <a href="https://google.com" target="_blank">Google</a>
        <a href="https://music.youtube.com" target="_blank">YouTube Music</a>
        <a href="https://pinterest.com" target="_blank">Pinterest</a>
        <a href="https://mail.google.com" target="_blank">Gmail</a>
    </div>

    <!-- Lo-fi Music -->
    <audio id="lofi" controls style="margin-top:10px; width:100%;">
        <source src="https://files.catbox.moe/1x9j8p.mp3" type="audio/mp3">
    </audio>

</div>

<script>
/* Daily Quotes */
const quotes = [
    "Take a deep breath — you're doing great.",
    "Small steps still move you forward.",
    "You deserve soft moments and warm coffee.",
    "Be gentle with yourself today.",
    "You are growing, even when it feels slow."
];
document.getElementById("quote-box").innerText =
    quotes[new Date().getDate() % quotes.length];

/* Calendar */
function updateClock() {
    const now = new Date();
    document.getElementById("date").innerText = now.toLocaleDateString();
    document.getElementById("time").innerText = now.toLocaleTimeString();
}
setInterval(updateClock, 1000);
updateClock();

/* To‑Do List */
let todos = JSON.parse(localStorage.getItem("todos") || "[]");
function renderTodos() {
    const list = document.getElementById("todo-list");
    list.innerHTML = "";
    todos.forEach((t, i) => {
        list.innerHTML += `
            <div class="todo-item">
                <input type="checkbox" ${t.done ? "checked" : ""} onclick="toggleTodo(${i})">
                <input type="text" value="${t.text}" oninput="editTodo(${i}, this.value)">
            </div>`;
    });
}
function addTodo() {
    todos.push({ text: "New task", done: false });
    saveTodos();
}
function toggleTodo(i) {
    todos[i].done = !todos[i].done;
    saveTodos();
}
function editTodo(i, text) {
    todos[i].text = text;
    saveTodos();
}
function saveTodos() {
    localStorage.setItem("todos", JSON.stringify(todos));
    renderTodos();
}
renderTodos();

/* Mood Tracker */
function saveMood() {
    const mood = {
        coffee: document.getElementById("coffee").value,
        notes: document.getElementById("mood-notes").value
    };
    localStorage.setItem("mood", JSON.stringify(mood));
}
function loadMood() {
    const mood = JSON.parse(localStorage.getItem("mood") || "{}");
    if (mood.coffee) document.getElementById("coffee").value = mood.coffee;
    if (mood.notes) document.getElementById("mood-notes").value = mood.notes;
}
loadMood();

/* Magic Button */
function doMagic() {
    alert("✨ A little magic for your day ✨");
}

/* Pet the cats */
document.getElementById("cat-left").onclick = () => {
    let c = document.getElementById("cat-left");
    c.classList.add("petting");
    setTimeout(() => c.classList.remove("petting"), 400);
};
document.getElementById("cat-right").onclick = () => {
    let c = document.getElementById("cat-right");
    c.classList.add("petting");
    setTimeout(() => c.classList.remove("petting"), 400);
};
</script>

</body>
</html>
