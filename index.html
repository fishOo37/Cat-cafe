<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Olivia’s Cozy Café</title>
<style>
/* ---------------- GLOBAL PAGE STYLE ---------------- */
body {
  margin: 0;
  padding: 0;
  font-family: "Segoe UI", sans-serif;
  background: url('https://img.magnific.com/premium-photo/serene-sunset-scene-featuring-sleeping-cat-balcony-surrounded-by-plants-books_1383414-2910.jpg?semt=ais_hybrid&w=740&q=80') center/cover no-repeat fixed;
  animation: warmGlow 10s ease-in-out infinite alternate;
  overflow-x: hidden;
}

/* Warm ambient glow */
@keyframes warmGlow {
  0% { filter: brightness(1) saturate(1); }
  100% { filter: brightness(1.15) saturate(1.2); }
}

/* ---------------- FALLING LEAVES ---------------- */
.leaf {
  position: fixed;
  top: -10vh;
  width: 25px;
  height: 25px;
  background-image: url('data:image/svg+xml;utf8,<svg width="40" height="40" xmlns="http://www.w3.org/2000/svg"><path fill="%23d49a6a" d="M20 0 C5 10 0 25 10 35 C25 40 35 25 30 10 Z"/></svg>');
  background-size: cover;
  opacity: 0.8;
  animation: fall linear infinite;
  pointer-events: none;
}

@keyframes fall {
  0% { transform: translateY(-10vh) rotate(0deg); }
  100% { transform: translateY(110vh) rotate(360deg); }
}

/* ---------------- CORNER CATS ---------------- */
.cat {
  position: fixed;
  width: 120px;
  cursor: pointer;
  z-index: 9999;
  transition: transform 0.2s ease;
}

.cat:hover {
  transform: scale(1.1);
}

/* Anime cat SVG */
.cat svg {
  width: 100%;
  height: auto;
}

/* Positions */
#catLeft { bottom: 20px; left: 20px; }
#catRight { bottom: 20px; right: 20px; }

/* ---------------- MAGIC BUTTON ---------------- */
#magicButton {
  position: fixed;
  top: 20px;
  right: 20px;
  background: #ffddb3;
  border: none;
  padding: 12px 20px;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
  box-shadow: 0 0 10px #0003;
  transition: 0.3s;
}

#magicButton:hover {
  background: #ffe8c9;
}

/* Glow mode */
.glow {
  filter: brightness(1.25) saturate(1.3);
}

/* ---------------- CHECKLIST ---------------- */
#checklist {
  position: fixed;
  top: 100px;
  left: 20px;
  background: #ffffffcc;
  padding: 15px;
  border-radius: 10px;
  width: 220px;
  backdrop-filter: blur(5px);
}

/* ---------------- QUOTES ---------------- */
#quoteBox {
  position: fixed;
  top: 20px;
  left: 20px;
  font-size: 20px;
  background: #ffffffcc;
  padding: 10px 15px;
  border-radius: 10px;
  width: 350px;
  backdrop-filter: blur(5px);
}

/* ---------------- LINKS ---------------- */
a {
  color: #8b4f2f;
  font-weight: bold;
}
a:hover {
  text-decoration: underline;
}
</style>
</head>
<body>

<!-- ---------------- QUOTE BOX ---------------- -->
<div id="quoteBox">“A cozy day begins with a warm heart.”</div>

<!-- ---------------- CHECKLIST ---------------- -->
<div id="checklist">
  <h3>To‑Do</h3>
  <label><input type="checkbox" class="task"> Make coffee</label><br>
  <label><input type="checkbox" class="task"> Pet the cats</label><br>
  <label><input type="checkbox" class="task"> Relax & breathe</label><br>
</div>

<!-- ---------------- MAGIC BUTTON ---------------- -->
<button id="magicButton">Magic Café Glow ✨</button>

<!-- ---------------- ANIME CORNER CATS ---------------- -->
<div id="catLeft" class="cat">
  <!-- Cute drawn anime cat SVG -->
  <svg viewBox="0 0 200 200">
    <path fill="#fff" stroke="#000" stroke-width="4"
      d="M50 60 Q20 20 40 10 Q70 20 80 50 Q100 40 120 50 Q130 20 160 10 Q180 20 150 60 Q170 80 160 120 Q150 160 100 170 Q50 160 40 120 Q30 80 50 60Z"/>
    <circle cx="75" cy="90" r="10" fill="#000"/>
    <circle cx="125" cy="90" r="10" fill="#000"/>
    <path d="M95 110 Q100 120 105 110" stroke="#000" stroke-width="4" fill="none"/>
  </svg>
</div>

<div id="catRight" class="cat">
  <svg viewBox="0 0 200 200">
    <path fill="#fff" stroke="#000" stroke-width="4"
      d="M50 60 Q20 20 40 10 Q70 20 80 50 Q100 40 120 50 Q130 20 160 10 Q180 20 150 60 Q170 80 160 120 Q150 160 100 170 Q50 160 40 120 Q30 80 50 60Z"/>
    <circle cx="75" cy="90" r="10" fill="#000"/>
    <circle cx="125" cy="90" r="10" fill="#000"/>
    <path d="M95 110 Q100 120 105 110" stroke="#000" stroke-width="4" fill="none"/>
  </svg>
</div>

<!-- ---------------- AUDIO ---------------- -->
<audio id="meowSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_7c8e90b9d1.mp3?filename=cat-meow-14536.mp3"></audio>
<audio id="purrSound" src="https://cdn.pixabay.com/download/audio/2021/09/06/audio_4f3e3e0f52.mp3?filename=cat-purr-1-110120.mp3"></audio>

<script>
/* ---------------- FALLING LEAVES GENERATOR ---------------- */
for (let i = 0; i < 12; i++) {
  let leaf = document.createElement("div");
  leaf.className = "leaf";
  leaf.style.left = Math.random() * 100 + "vw";
  leaf.style.animationDuration = 6 + Math.random() * 6 + "s";
  leaf.style.animationDelay = Math.random() * 5 + "s";
  document.body.appendChild(leaf);
}

/* ---------------- CAT INTERACTIONS ---------------- */
const cats = document.querySelectorAll(".cat");
const meow = document.getElementById("meowSound");
const purr = document.getElementById("purrSound");

cats.forEach(cat => {
  cat.addEventListener("click", () => {
    meow.currentTime = 0;
    meow.play();
  });
  cat.addEventListener("mouseenter", () => {
    purr.currentTime = 0;
    purr.play();
  });
});

/* ---------------- MAGIC BUTTON ---------------- */
document.getElementById("magicButton").addEventListener("click", () => {
  document.body.classList.toggle("glow");
});

/* ---------------- CHECKLIST SAVE ---------------- */
const tasks = document.querySelectorAll(".task");

tasks.forEach((task, i) => {
  task.checked = localStorage.getItem("task" + i) === "true";
  task.addEventListener("change", () => {
    localStorage.setItem("task" + i, task.checked);
  });
});

/* ---------------- QUOTES ---------------- */
const quotes = [
  "“A cozy day begins with a warm heart.”",
  "“Happiness is a cup of coffee and a good book.”",
  "“Let the cats nap and the leaves fall.”",
  "“Peace is brewed slowly, like coffee.”"
];

setInterval(() => {
  document.getElementById("quoteBox").textContent =
    quotes[Math.floor(Math.random() * quotes.length)];
}, 10000);
</script>

</body>
</html>
