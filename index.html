<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Olivia’s Cozy Café</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* -------------------- COLORS -------------------- */
:root {
  --accent:#f4b27a;
  --soft:#f8d4a8;
  --cream:#fff3e0;
  --outline:#5b3a2a;
  --blush:#f7a6a6;
  --bg:#1a0f0a;
  --text:#fdf5e9;
  --muted:#e3d2c0;
}

/* -------------------- GLOBAL -------------------- */
body {
  margin:0;
  font-family:"Segoe UI",sans-serif;
  color:var(--text);
  background:#1a0f0a;
  overflow-x:hidden;
  font-size:14px;
}

/* -------------------- BACKGROUND -------------------- */
.background {
  position:fixed; inset:0;
  background:url("https://img.magnific.com/premium-photo/serene-sunset-scene-featuring-sleeping-cat-balcony-surrounded-by-plants-books_1383414-2910.jpg?semt=ais_hybrid&w=740&q=80")
    center/cover no-repeat;
  filter:blur(2px) brightness(0.7);
  z-index:-2;
}
.overlay {
  position:fixed; inset:0;
  background:radial-gradient(circle at top,rgba(255,210,150,.35),transparent 55%),
             linear-gradient(to bottom,rgba(15,8,5,.7),rgba(10,5,3,.95));
  z-index:-1;
}
body.night .background { filter:blur(2px) brightness(0.4); }
body.night .overlay {
  background:radial-gradient(circle at top,rgba(120,160,255,.25),transparent 55%),
             linear-gradient(to bottom,rgba(5,8,20,.9),rgba(3,5,12,.98));
}

/* -------------------- LEAVES -------------------- */
.leaf {
  position:fixed;
  width:6px; height:10px;
  background:rgba(255,200,140,.55);
  border-radius:50%;
  opacity:.5;
  animation:fall linear infinite;
  filter:blur(0.3px);
}
@keyframes fall {
  0% { transform:translateY(-10vh) translateX(0) rotate(0); }
  100% { transform:translateY(110vh) translateX(10px) rotate(120deg); }
}

/* -------------------- SPARKLES -------------------- */
.sparkle {
  position:fixed;
  width:4px; height:4px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 8px #fff;
  animation:spark 6s linear infinite;
}
@keyframes spark {
  0% { transform:translateY(100vh) scale(.4); opacity:0; }
  20% { opacity:1; }
  100% { transform:translateY(-10vh) scale(1); opacity:0; }
}

/* -------------------- GRID LAYOUT -------------------- */
.container {
  max-width:1100px;
  margin:0 auto;
  padding:20px;
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));
  gap:20px;
}

/* -------------------- CARDS -------------------- */
.card {
  background:rgba(35,22,18,.9);
  border-radius:18px;
  padding:15px;
  box-shadow:0 18px 40px rgba(0,0,0,.55);
}
h1 { font-size:1.4rem; margin:0 0 10px; }
h3 { font-size:1.1rem; margin:0 0 8px; }
button {
  background:linear-gradient(135deg,#f7c08a,#f39b7a);
  border:none;
  border-radius:999px;
  padding:6px 14px;
  font-weight:600;
  color:#3b1f12;
  cursor:pointer;
}
button:hover { filter:brightness(1.1); }

/* -------------------- CATS -------------------- */
.cat {
  position:fixed;
  width:100px; height:100px;
  z-index:5;
  cursor:pointer;
}
.cat svg { width:100%; height:100%; }
.cat.left { bottom:10px; left:10px; }
.cat.right { bottom:10px; right:10px; }

.cat-body {
  transform-origin:50% 60%;
  animation:breath 4s ease-in-out infinite;
}
@keyframes breath {
  0%,100% { transform:scale(1); }
  50% { transform:scale(1.03); }
}

.cat.patting .cat-body {
  animation:pat 0.4s ease;
}
@keyframes pat {
  0% { transform:translateY(0) scale(1.03); }
  50% { transform:translateY(2px) scale(1.06); }
  100% { transform:translateY(0) scale(1.03); }
}

.cat-face {
  transition:transform 0.2s;
}
.cat.patting .cat-face {
  transform:translateY(-1px);
}

.toast {
  position:fixed;
  left:50%; bottom:80px;
  transform:translateX(-50%);
  background:rgba(25,15,10,.96);
  border-radius:999px;
  padding:8px 16px;
  font-size:.85rem;
  border:1px solid rgba(255,255,255,.18);
  opacity:0;
  transition:.25s;
}
.toast.show {
  opacity:1;
  transform:translateX(-50%) translateY(-4px);
}

/* -------------------- LINKS -------------------- */
.links a {
  display:inline-block;
  margin:4px;
  padding:6px 12px;
  border-radius:999px;
  background:rgba(30,18,12,.9);
  color:#ffd59b;
  text-decoration:none;
  font-size:.85rem;
}
.links a:hover {
  background:rgba(50,30,20,.95);
  color:#ffe9c7;
}

/* -------------------- TO‑DO LIST -------------------- */
.todo-item {
  display:flex;
  align-items:center;
  margin:6px 0;
}
.todo-item input[type="checkbox"] {
  width:18px; height:18px;
  margin-right:10px;
  accent-color:#f4b27a;
}
.todo-item input[type="text"] {
  flex:1;
  background:transparent;
  border:none;
  border-bottom:1px dashed rgba(255,255,255,.2);
  color:var(--text);
  font-size:1rem;
}
.todo-item input[type="text"]:focus {
  outline:none;
  border-bottom:1px solid var(--accent);
}
.delete-btn {
  margin-left:10px;
  cursor:pointer;
  color:#ffb3b3;
  font-size:1.2rem;
}

/* -------------------- MOOD NOTEBOOK -------------------- */
.mood-wrapper {
  display:flex;
  flex-direction:column;
  gap:12px;
}
.mood-today {
  background:rgba(50,30,20,.9);
  border-radius:14px;
  padding:12px;
}
.mood-row {
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:6px;
}
.mood-row select {
  background:rgba(20,10,5,.9);
  color:var(--text);
  border-radius:999px;
  border:1px solid rgba(255,255,255,.2);
  padding:4px 10px;
}
#moodNote {
  width:100%;
  min-height:60px;
  margin-top:6px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(20,10,5,.9);
  color:var(--text);
  padding:6px 8px;
  resize:vertical;
}

/* calendar */
.mood-calendar {
  background:rgba(50,30,20,.9);
  border-radius:14px;
  padding:12px;
}
.calendar-grid {
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
  font-size:.75rem;
}
.calendar-day-header {
  text-align:center;
  color:var(--muted);
}
.calendar-cell {
  height:32px;
  border-radius:8px;
  background:rgba(30,18,12,.9);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  border:1px solid transparent;
}
.calendar-cell.today {
  border-color:var(--accent);
}
.calendar-cell span.date {
  font-size:.7rem;
  color:var(--muted);
}
.calendar-cell span.coffee {
  font-size:1rem;
}

/* audio hidden */
#lofiAudio, #meowAudio { display:none; }
</style>
</head>

<script>
/* -------------------- LEAVES -------------------- */
for(let i=0;i<10;i++){
  const l=document.createElement("div");
  l.className="leaf";
  l.style.left=Math.random()*100+"vw";
  l.style.animationDuration=10+Math.random()*8+"s";
  l.style.animationDelay=Math.random()*6+"s";
  document.body.appendChild(l);
}

/* -------------------- SPARKLES -------------------- */
for(let i=0;i<18;i++){
  const s=document.createElement("div");
  s.className="sparkle";
  s.style.left=Math.random()*100+"vw";
  s.style.animationDelay=Math.random()*6+"s";
  s.style.animationDuration=5+Math.random()*6+"s";
  document.body.appendChild(s);
}

/* -------------------- DATE + TIME -------------------- */
function updateTime(){
  const n=new Date();
  document.getElementById("date").textContent =
    n.toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"});
  document.getElementById("time").textContent =
    n.toLocaleTimeString();
}
setInterval(updateTime,1000);
updateTime();
